[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asas-py"
version = "0.1.0"
authors = [
  { name="Hesham Moawad", email="heshammoawad120120@gmail.com" },
]
description = "The simple, type-safe Python API client builder."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "api",
    "client",
    "http",
    "decorators",
    "rest",
    "async",
    "pydantic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
requests = ["requests>=2.31"]

[tool.setuptools.packages.find]
include = ["asas*"]

[project.urls]
Homepage = "https://github.com/HeshamMoawad/asas-py"
Documentation = "https://heshammoawad.github.io/asas-py/"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
